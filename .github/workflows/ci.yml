name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch: the full CUDA wheel is several GB and nothing here
      # needs a GPU. The tests build the model with pretrained=False, so no
      # ImageNet weights are downloaded either.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Installs the package itself (editable) plus test deps, so
          # `astana_heights` is importable rather than relying on pytest
          # happening to put the working directory on sys.path.
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Check the training script's interface is intact
        run: python train.py --help

      # Recomputes the confidence intervals quoted in the README from the
      # committed predictions. Needs no GPU, checkpoint or dataset.
      - name: Reproduce the uncertainty analysis
        run: python scripts/evaluate_uncertainty.py --resamples 2000

      # Recomputes the 5-seed training-vs-sampling variance decomposition and
      # the prediction intervals quoted in the README. Also CPU-only.
      - name: Reproduce the seed-variance decomposition
        run: python scripts/seed_variance.py --resamples 2000
